<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.52" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8895A"/>
      <stop offset="0.5" stop-color="#E5C77D"/>
      <stop offset="1" stop-color="#B7924D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" rx="124" fill="url(#bg)"/>
  <rect x="86" y="86" width="628" height="628" rx="76" fill="none" stroke="#D8BC83" stroke-width="3" opacity=".18"/>
  <text x="400" y="464"
        text-anchor="middle"
        font-family="Arial Black, Helvetica, Arial, sans-serif"
        font-size="156"
        font-weight="900"
        letter-spacing="0"
        fill="#F8FAFC"
        filter="url(#glow)">EA<tspan fill="#D8BC83">X</tspan>AU</text>
</svg>
