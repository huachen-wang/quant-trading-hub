services:
  mysql:
    image: mysql:8.4
    container_name: quant-trading-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: quant_trading_hub
      MYSQL_USER: quant
      MYSQL_PASSWORD: quantpass
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "quant", "-pquantpass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
